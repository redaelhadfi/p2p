<!DOCTYPE html>
<html>
<head>
    <title>DataChannel example</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #333;
            text-align: center;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }
        textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: monospace;
        }
        textarea:disabled {
            background-color: #f9f9f9;
            cursor: not-allowed;
        }
        #buttons {
            text-align: center;
            margin-top: 20px;
        }
        button {
            padding: 10px 30px;
            margin: 0 10px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
            transition: all 0.3s;
        }
        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }
        #startButton {
            background-color: #4CAF50;
        }
        #startButton:hover:not(:disabled) {
            background-color: #45a049;
        }
        #sendButton {
            background-color: #2196F3;
        }
        #sendButton:hover:not(:disabled) {
            background-color: #0b7dda;
        }
        #closeButton {
            background-color: #f44336;
        }
        #closeButton:hover:not(:disabled) {
            background-color: #da190b;
        }
    </style>
</head>
<body>
    <h1>RTCDataChannel Example</h1>
    <p><strong>Instructions:</strong> 1) Press Start; 2) Enter text; 3) Press Send</p>
    <textarea rows="5" cols="50" id="dataChannelSend" disabled 
        placeholder="1: Press Start; 2: Enter text; 3: Press Send."></textarea>
    <textarea rows="5" cols="50" id="dataChannelReceive" disabled 
        placeholder="Received messages will appear here..."></textarea>
    <div id="buttons">
        <button id="startButton">Start</button>
        <button id="sendButton">Send</button>
        <button id="closeButton">Stop</button>
    </div>
    <script src="js/dataChannel.js"></script>
</body>
</html>
