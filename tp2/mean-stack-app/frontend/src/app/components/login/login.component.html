<div class="container">
  <div class="login-container">
    <div class="card">
      <h1 class="text-center">🔐 Login</h1>
      <p class="text-center subtitle">Welcome back! Please login to your account.</p>

      <div *ngIf="errorMessage" class="alert alert-danger">
        {{ errorMessage }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="form-control"
            [class.invalid]="submitted && f['email'].errors"
            placeholder="Enter your email"
          />
          <div *ngIf="submitted && f['email'].errors" class="error-message">
            <span *ngIf="f['email'].errors['required']">Email is required</span>
            <span *ngIf="f['email'].errors['email']">Email must be valid</span>
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            formControlName="password"
            class="form-control"
            [class.invalid]="submitted && f['password'].errors"
            placeholder="Enter your password"
          />
          <div *ngIf="submitted && f['password'].errors" class="error-message">
            <span *ngIf="f['password'].errors['required']">Password is required</span>
            <span *ngIf="f['password'].errors['minlength']">Password must be at least 6 characters</span>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" [disabled]="loading">
          <span *ngIf="loading" class="spinner"></span>
          <span *ngIf="!loading">Login</span>
        </button>
      </form>

      <div class="text-center mt-20">
        <p>Don't have an account? <a routerLink="/register" class="link">Register here</a></p>
      </div>
    </div>
  </div>
</div>
