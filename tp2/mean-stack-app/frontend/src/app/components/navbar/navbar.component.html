<nav>
  <div class="container">
    <div class="nav-content">
      <div class="logo">
        <h2>🚀 MEAN Stack App</h2>
      </div>

        <li><a routerLink="/dashboard" routerLinkActive="active">Dashboard</a></li>

      </ul>

  </div>
